<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Barter | My Trades</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --navy: #043873; --navy-deep: #032B57; --blue: #4F9CF9;
    --yellow: #FFE492; --yellow-deep: #FFD966;
    --ink: #212529; --muted: #5B6470; --soft: #F7FAFD; --card: #FFFFFF; --line: #E3E9F0;
    --offer: #16A34A; --offer-bg: #E8F7EE; --need: #F97316; --need-bg: #FEF0E6;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--soft); color: var(--ink);
    display: flex; justify-content: center; min-height: 100vh;
  }
  h1, h2, .btn { font-family: "DM Sans", "Inter", sans-serif; }
  .icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; flex-shrink: 0; }
  .icon.sm { width: 15px; height: 15px; }

  .app { width: 100%; max-width: 460px; display: flex; flex-direction: column; min-height: 100vh; }
  @media (min-width: 900px) { .app { max-width: 720px; } }

  .topbar { position: fixed; top: 0; left: 0; right: 0; background: var(--navy); color: #FFFFFF; z-index: 100; box-shadow: 0 2px 14px rgba(3,43,87,0.35); }
  .topbar-inner { max-width: 460px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  @media (min-width: 900px) { .topbar-inner { max-width: 720px; } }
  .topbar-inner a { color: #FFFFFF; display: flex; }
  .topbar-inner .title { font-size: 16px; font-weight: 800; flex: 1; }
  .page-spacer { height: 58px; }

  .body { padding: 16px 14px 40px; flex: 1; }

  .tabs { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin-bottom: 16px; }
  .tab { flex: 1; text-align: center; padding: 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .tab.active { background: var(--navy); color: #FFFFFF; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: 0 8px 22px rgba(4,56,115,0.05); }

  .trade-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #E1EEFE; color: var(--blue); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0; }
  .trade-name { font-size: 14px; font-weight: 800; }
  .trade-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .status { font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .st-pending { background: var(--yellow); color: var(--navy); }
  .st-accepted { background: var(--offer-bg); color: #0F6E56; }
  .st-declined { background: #F1F2F4; color: var(--muted); }
  .st-completed { background: #E1EEFE; color: var(--blue); }

  .skill-row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .skill-col { flex: 1; min-width: 0; }
  .skill-col .lbl { font-size: 10px; font-weight: 800; letter-spacing: 0.03em; margin-bottom: 4px; }
  .skill-col.o .lbl { color: #0F6E56; }
  .skill-col.n .lbl { color: #A14E10; }
  .skill-col .val { font-size: 12.5px; font-weight: 700; }
  .terms { font-size: 12px; color: var(--muted); background: var(--soft); border-radius: 9px; padding: 9px 11px; margin-bottom: 12px; }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; font-size: 13px; font-weight: 700; padding: 11px; border-radius: 10px; border: none; cursor: pointer; font-family: inherit; margin-top: 8px; }
  .btn-navy { background: var(--navy); color: #FFFFFF; }
  .btn-green { background: var(--offer); color: #FFFFFF; }
  .btn-outline { background: transparent; color: var(--navy); border: 1.5px solid var(--line); }
  .btn-danger-outline { background: transparent; color: #A32D2D; border: 1.5px solid #F0C4C4; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { margin-top: 0; }

  .rating-row { display: flex; justify-content: center; gap: 6px; margin: 4px 0 12px; }
  .star-btn { background: none; border: none; cursor: pointer; color: var(--line); padding: 2px; }
  .star-btn.on { color: var(--yellow-deep); }
  .star-btn svg { width: 26px; height: 26px; }
  .rated-note { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 4px; }

  .empty { text-align: center; color: var(--muted); font-size: 13.5px; padding: 40px 18px; background: var(--card); border-radius: var(--radius); border: 1px dashed var(--line); }
  .empty .icon { width: 30px; height: 30px; margin-bottom: 10px; color: var(--blue); opacity: 0.5; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); width: fit-content; max-width: 90%; background: var(--navy); color: #FFFFFF; font-size: 12.5px; font-weight: 600; padding: 11px 18px; border-radius: 999px; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 200; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-inner">
      <a href="dashboard.html" aria-label="Back to board">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <p class="title">My trades</p>
    </div>
  </header>
  <div class="page-spacer"></div>

  <div class="body">
    <div class="tabs">
      <div class="tab active" id="tabActive" onclick="switchTab('active')">Active</div>
      <div class="tab" id="tabCompleted" onclick="switchTab('completed')">Completed</div>
    </div>

    <div id="tradesList"></div>
  </div>

  <div id="toast"></div>
</div>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/db.js"></script>
<script type="module" src="js/trades.js"></script>
<script>
  let currentUser = null;
  let allTrades = [];
  let currentTab = "active";

  window.onload = function () {
    let stored = localStorage.getItem("currentUser");
    if (stored === null) {
      document.getElementById("tradesList").innerHTML =
        '<div class="empty"><p>Sign in to see your trades.</p></div>';
      return;
    }
    currentUser = JSON.parse(stored);
    loadTrades();
  };

  function loadTrades() {
    if (window.CBTrades === undefined) {
      setTimeout(loadTrades, 200);
      return;
    }
    CBTrades.getMyTrades(currentUser.uid).then(function (result) {
      if (result.ok) {
        allTrades = result.data;
      } else {
        allTrades = [];
        console.error("Failed to load trades:", result.message);
      }
      render();
    });

    /* Self-heal my own profile rating in the background — see
       the big comment in trades.js for why it can only ever be
       "my own" rating, never someone else's, from the client. */
    CBTrades.recalcMyRating(currentUser.uid);
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById("tabActive").classList.toggle("active", tab === "active");
    document.getElementById("tabCompleted").classList.toggle("active", tab === "completed");
    render();
  }

  function initials(name) {
    let parts = name.trim().split(" ");
    let first = parts[0].charAt(0);
    let second = parts.length > 1 ? parts[1].charAt(0) : "";
    return (first + second).toUpperCase();
  }

  /* am I the proposer or the receiver on this trade? shapes
     which skill is "mine", which WhatsApp number to open,
     and which rating field belongs to me. */
  function myRole(trade) {
    return trade.proposerUid === currentUser.uid ? "proposer" : "receiver";
  }

  function whatsappLink(trade, role) {
    let theirNumber = role === "proposer" ? trade.receiverWhatsapp : trade.proposerWhatsapp;
    let theirName = role === "proposer" ? trade.receiverName : trade.proposerName;
    let mySkill = role === "proposer" ? trade.offeredSkill : trade.requestedSkill;
    let theirSkill = role === "proposer" ? trade.requestedSkill : trade.offeredSkill;
    let message = "Hi " + theirName + "! Campus Barter match: my " + mySkill +
      " for your " + theirSkill + ". When works for you?";
    /* WhatsApp deep link: countrycode + number, no leading 0.
       Our numbers are stored as 0XXXXXXXXXX or 234XXXXXXXXXX. */
    let digits = theirNumber.replace(/\D/g, "");
    if (digits.charAt(0) === "0") digits = "234" + digits.slice(1);
    return "https://wa.me/" + digits + "?text=" + encodeURIComponent(message);
  }

  function render() {
    let list = document.getElementById("tradesList");

    let filtered = allTrades.filter(function (t) {
      if (currentTab === "active") return t.status === "pending" || t.status === "accepted";
      return t.status === "completed" || t.status === "declined";
    });

    if (filtered.length === 0) {
      let msg = currentTab === "active"
        ? "No active trades. Propose a swap from the board to get started."
        : "No completed trades yet.";
      list.innerHTML = '<div class="empty"><svg class="icon" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><p>' + msg + "</p></div>";
      return;
    }

    let html = "";
    for (let i = 0; i < filtered.length; i++) {
      html += tradeCard(filtered[i]);
    }
    list.innerHTML = html;
  }

  function tradeCard(t) {
    let role = myRole(t);
    let theirName = role === "proposer" ? t.receiverName : t.proposerName;
    let mySkill = role === "proposer" ? t.offeredSkill : t.requestedSkill;
    let theirSkill = role === "proposer" ? t.requestedSkill : t.offeredSkill;
    let iAmReceiver = role === "receiver";

    let statusLabel = t.status.charAt(0).toUpperCase() + t.status.slice(1);
    let html = '<div class="card">' +
      '<div class="trade-top">' +
        '<div class="avatar">' + initials(theirName) + "</div>" +
        '<div><p class="trade-name">' + theirName + '</p><p class="trade-sub">' +
        (role === "proposer" ? "You proposed" : "They proposed") + "</p></div>" +
        '<span class="status st-' + t.status + '">' + statusLabel + "</span>" +
      "</div>" +
      '<div class="skill-row">' +
        '<div class="skill-col o"><p class="lbl">YOU GIVE</p><p class="val">' + mySkill + "</p></div>" +
        '<div class="skill-col n"><p class="lbl">YOU GET</p><p class="val">' + theirSkill + "</p></div>" +
      "</div>";

    if (t.terms) {
      html += '<p class="terms">' + t.terms + "</p>";
    }

    /* ---- action area depends on status + role ---- */
    if (t.status === "pending") {
      if (iAmReceiver) {
        html += '<div class="btn-row">' +
          '<button class="btn btn-green" onclick="doAccept(\'' + t.id + '\')">Accept</button>' +
          '<button class="btn btn-danger-outline" onclick="doDecline(\'' + t.id + '\')">Decline</button>' +
        "</div>";
      } else {
        html += '<p class="trade-sub" style="text-align:center; margin-top:4px;">Waiting for ' + theirName + " to respond.</p>";
      }
    } else if (t.status === "accepted") {
      html += '<a class="btn btn-green" href="' + whatsappLink(t, role) + '" target="_blank" rel="noopener">' +
        '<svg class="icon sm" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>' +
        "Chat on WhatsApp</a>" +
        '<button class="btn btn-outline" onclick="doComplete(\'' + t.id + '\')">Mark completed</button>';
    } else if (t.status === "completed") {
      let myRatingField = role === "proposer" ? "proposerRating" : "receiverRating";
      let alreadyRated = t[myRatingField] !== null && t[myRatingField] !== undefined;

      if (alreadyRated) {
        html += '<p class="rated-note">You rated this trade ' + t[myRatingField] + " / 5</p>";
      } else {
        html += '<p class="rated-note">How was the swap with ' + theirName + "?</p>" +
          '<div class="rating-row" id="stars-' + t.id + '">' + starRow(t.id, 0) + "</div>" +
          '<button class="btn btn-navy" onclick="submitRating(\'' + t.id + "', '" + role + '\')">Submit rating</button>';
      }
    }

    html += "</div>";
    return html;
  }

  let pendingRatings = {};

  function starRow(tradeId, selected) {
    let out = "";
    for (let i = 1; i <= 5; i++) {
      out += '<button type="button" class="star-btn' + (i <= selected ? " on" : "") +
        '" onclick="setStar(\'' + tradeId + "', " + i + ')" aria-label="' + i + ' stars">' +
        '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>';
    }
    return out;
  }

  function setStar(tradeId, value) {
    pendingRatings[tradeId] = value;
    document.getElementById("stars-" + tradeId).innerHTML = starRow(tradeId, value);
  }

  function doAccept(tradeId) {
    CBTrades.acceptTrade(tradeId).then(function (result) {
      if (result.ok) { showToast("Trade accepted"); loadTrades(); }
      else { showToast(result.message); }
    });
  }

  function doDecline(tradeId) {
    CBTrades.declineTrade(tradeId).then(function (result) {
      if (result.ok) { showToast("Trade declined"); loadTrades(); }
      else { showToast(result.message); }
    });
  }

  function doComplete(tradeId) {
    CBTrades.completeTrade(tradeId).then(function (result) {
      if (result.ok) { showToast("Marked completed. Rate your trade partner!"); loadTrades(); }
      else { showToast(result.message); }
    });
  }

  function submitRating(tradeId, role) {
    let stars = pendingRatings[tradeId];
    if (stars === undefined || stars === 0) {
      showToast("Pick a star rating first");
      return;
    }
    CBTrades.rateTrade(tradeId, role, stars).then(function (result) {
      if (result.ok) { showToast("Thanks for rating!"); loadTrades(); }
      else { showToast(result.message); }
    });
  }

  let toastTimer = null;
  function showToast(message) {
    let t = document.getElementById("toast");
    t.textContent = message;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2400);
  }
</script>
</body>
</html>
