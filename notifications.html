<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Barter | Notifications</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --navy: #043873; --blue: #4F9CF9; --yellow: #FFE492; --yellow-deep: #FFD966;
    --ink: #212529; --muted: #5B6470; --soft: #F7FAFD; --card: #FFFFFF; --line: #E3E9F0;
    --offer: #16A34A; --offer-bg: #E8F7EE; --need: #F97316; --need-bg: #FEF0E6;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--soft); color: var(--ink);
    display: flex; justify-content: center; min-height: 100vh;
  }
  h1, .btn { font-family: "DM Sans", "Inter", sans-serif; }
  .icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; flex-shrink: 0; }

  .app { width: 100%; max-width: 460px; display: flex; flex-direction: column; min-height: 100vh; }
  @media (min-width: 900px) { .app { max-width: 620px; } }

  .topbar { position: fixed; top: 0; left: 0; right: 0; background: var(--navy); color: #FFFFFF; z-index: 100; box-shadow: 0 2px 14px rgba(3,43,87,0.35); }
  .topbar-inner { max-width: 460px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  @media (min-width: 900px) { .topbar-inner { max-width: 620px; } }
  .topbar-inner a { color: #FFFFFF; display: flex; }
  .topbar-inner .title { font-size: 16px; font-weight: 800; flex: 1; }
  .page-spacer { height: 58px; }

  .body { padding: 16px 14px 40px; flex: 1; }

  .day-label { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 16px 0 8px; }
  .day-label:first-child { margin-top: 0; }

  .notif { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; text-decoration: none; color: inherit; box-shadow: 0 6px 16px rgba(4,56,113,0.05); }
  .notif-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ni-yellow { background: var(--yellow); color: var(--navy); }
  .ni-green { background: var(--offer-bg); color: #0F6E56; }
  .ni-orange { background: var(--need-bg); color: #A14E10; }
  .ni-muted { background: #EEF1F5; color: var(--muted); }
  .notif p { font-size: 13px; line-height: 1.45; }
  .notif p b { font-weight: 700; }
  .notif .when { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .empty { text-align: center; color: var(--muted); font-size: 13.5px; padding: 40px 18px; background: var(--card); border-radius: var(--radius); border: 1px dashed var(--line); }
  .empty .icon { width: 30px; height: 30px; margin-bottom: 10px; color: var(--blue); opacity: 0.5; }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-inner">
      <a href="dashboard.html" aria-label="Back to board">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <p class="title">Notifications</p>
    </div>
  </header>
  <div class="page-spacer"></div>

  <div class="body" id="body">
    <div class="empty">Loading...</div>
  </div>

</div>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/trades.js"></script>
<script type="module" src="js/activity.js"></script>
<script>
  /* ============================================================
     NOTIFICATIONS, DERIVED — NOT STORED
     ------------------------------------------------------------
     There is no "notifications" collection in Firestore. Every
     notification we'd want to show is really just a TRADE in a
     particular state, and we already have all trades. So this
     page turns your trade list into a feed by reading each
     trade's status/role and writing a sentence for it — genuine,
     live data, zero new backend, zero new security rules.
     ============================================================ */

  let currentUser = null;

  window.onload = function () {
    let stored = localStorage.getItem("currentUser");
    if (stored === null) {
      document.getElementById("body").innerHTML =
        '<div class="empty">Sign in to see your notifications.</div>';
      return;
    }
    currentUser = JSON.parse(stored);
    loadFeed();
  };

  function loadFeed() {
    if (window.CBTrades === undefined || window.CBActivity === undefined) {
      setTimeout(loadFeed, 200);
      return;
    }
    Promise.all([
      CBTrades.getMyTrades(currentUser.uid),
      CBActivity.getMyActivity(currentUser.uid)
    ]).then(function (results) {
      let tradesResult = results[0];
      let activityResult = results[1];

      let trades = tradesResult.ok ? tradesResult.data : [];
      let activity = activityResult.ok ? activityResult.data : [];

      render(trades, activity);
    });
  }

  function timeAgo(timestamp) {
    if (!timestamp) return "Just now";
    let ms = Date.now() - timestamp.toMillis();
    let mins = Math.floor(ms / 60000);
    if (mins < 1) return "Just now";
    if (mins < 60) return mins + "m ago";
    let hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    let days = Math.floor(hrs / 24);
    if (days < 7) return days + "d ago";
    return timestamp.toDate().toLocaleDateString();
  }

  function dayGroup(timestamp) {
    if (!timestamp) return "Today";
    let d = timestamp.toDate();
    let today = new Date();
    let diffDays = Math.floor((today - d) / 86400000);
    if (diffDays === 0) return "Today";
    if (diffDays === 1) return "Yesterday";
    return "Earlier";
  }

  function bellIcon(cls, svgPath) {
    return '<div class="notif-icon ' + cls + '">' + svgPath + "</div>";
  }

  const ICONS = {
    match: '<svg class="icon" style="width:16px;height:16px;" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
    check: '<svg class="icon" style="width:16px;height:16px;" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
    x: '<svg class="icon" style="width:16px;height:16px;" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
    star: '<svg class="icon" style="width:16px;height:16px;" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
    settings: '<svg class="icon" style="width:16px;height:16px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>'
  };

  /* Turn one trade into zero or one feed entries, from MY point
     of view (role-aware — the same trade reads differently for
     the two people in it). */
  function tradeToEntry(t) {
    let role = t.proposerUid === currentUser.uid ? "proposer" : "receiver";
    let theirName = role === "proposer" ? t.receiverName : t.proposerName;
    let iAmReceiver = role === "receiver";
    let myRatingField = role === "proposer" ? "proposerRating" : "receiverRating";
    let iRated = t[myRatingField] !== null && t[myRatingField] !== undefined;

    if (t.status === "pending" && iAmReceiver) {
      return { icon: bellIcon("ni-yellow", ICONS.match),
        text: "<b>" + theirName + "</b> wants to swap: their " + t.offeredSkill + " for your " + t.requestedSkill + ".",
        time: t.createdAt, href: "trades.html" };
    }
    if (t.status === "accepted") {
      let text = role === "proposer"
        ? "<b>" + theirName + "</b> accepted your trade proposal."
        : "You accepted <b>" + theirName + "</b>'s trade proposal.";
      return { icon: bellIcon("ni-green", ICONS.check), text: text, time: t.updatedAt, href: "trades.html" };
    }
    if (t.status === "declined") {
      return { icon: bellIcon("ni-muted", ICONS.x),
        text: "<b>" + theirName + "</b> declined the trade proposal.",
        time: t.updatedAt, href: "trades.html" };
    }
    if (t.status === "completed" && iRated === false) {
      return { icon: bellIcon("ni-orange", ICONS.star),
        text: "Trade completed with <b>" + theirName + "</b>. Rate the swap.",
        time: t.updatedAt, href: "trades.html" };
    }
    if (t.status === "completed" && iRated === true) {
      return { icon: bellIcon("ni-muted", ICONS.check),
        text: "Trade completed with <b>" + theirName + "</b>.",
        time: t.updatedAt, href: "trades.html" };
    }
    return null;
  }

  function render(trades, activity) {
    let entries = [];
    for (let i = 0; i < trades.length; i++) {
      let entry = tradeToEntry(trades[i]);
      if (entry !== null) entries.push(entry);
    }

    /* activity entries plug straight into the same feed shape:
       icon, text, time, href — one merged, sorted list. */
    for (let i = 0; i < activity.length; i++) {
      let a = activity[i];
      entries.push({
        icon: bellIcon("ni-green", ICONS.settings),
        text: a.message,
        time: a.createdAt,
        href: "profile.html"
      });
    }

    entries.sort(function (a, b) {
      let aTime = a.time ? a.time.toMillis() : Date.now();
      let bTime = b.time ? b.time.toMillis() : Date.now();
      return bTime - aTime;
    });

    let body = document.getElementById("body");

    if (entries.length === 0) {
      body.innerHTML =
        '<div class="empty"><svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>' +
        "<p>Nothing here yet. Propose a trade to get things moving.</p></div>";
      return;
    }

    let html = "";
    let lastGroup = null;
    for (let i = 0; i < entries.length; i++) {
      let e = entries[i];
      let group = dayGroup(e.time);
      if (group !== lastGroup) {
        html += '<p class="day-label">' + group + "</p>";
        lastGroup = group;
      }
      html += '<a class="notif" href="' + e.href + '">' + e.icon +
        '<div><p>' + e.text + '</p><p class="when">' + timeAgo(e.time) + "</p></div></a>";
    }
    body.innerHTML = html;
  }
</script>
</body>
</html>
