<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Barter | My Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --navy: #043873; --navy-deep: #032B57; --blue: #4F9CF9;
    --yellow: #FFE492; --yellow-deep: #FFD966;
    --ink: #212529; --muted: #5B6470; --soft: #F7FAFD; --card: #FFFFFF; --line: #E3E9F0;
    --offer: #16A34A; --offer-bg: #E8F7EE; --need: #F97316; --need-bg: #FEF0E6;
    --danger: #E11D48; --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--soft); color: var(--ink);
    display: flex; justify-content: center; min-height: 100vh;
  }
  h1, .btn { font-family: "DM Sans", "Inter", sans-serif; }
  .icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; flex-shrink: 0; }
  .icon.sm { width: 15px; height: 15px; }

  .app { width: 100%; max-width: 460px; display: flex; flex-direction: column; min-height: 100vh; }
  @media (min-width: 900px) { .app { max-width: 620px; } }

  .topbar { position: fixed; top: 0; left: 0; right: 0; background: var(--navy); color: #FFFFFF; z-index: 100; box-shadow: 0 2px 14px rgba(3,43,87,0.35); }
  .topbar-inner { max-width: 460px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  @media (min-width: 900px) { .topbar-inner { max-width: 620px; } }
  .topbar-inner a { color: #FFFFFF; display: flex; }
  .topbar-inner .title { font-size: 16px; font-weight: 800; flex: 1; }
  .page-spacer { height: 58px; }

  .body { padding: 20px 14px 40px; flex: 1; }

  .profile-head { text-align: center; margin-bottom: 20px; }
  .avatar-lg { width: 64px; height: 64px; border-radius: 50%; background: var(--yellow); color: var(--navy); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; margin: 0 auto 12px; }
  .profile-name { font-size: 19px; font-weight: 800; }
  .profile-meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .stat-row { display: flex; justify-content: center; gap: 22px; margin-top: 14px; }
  .stat { text-align: center; }
  .stat .num { font-size: 18px; font-weight: 800; }
  .stat .lbl { font-size: 10.5px; color: var(--muted); font-weight: 700; letter-spacing: 0.03em; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: 0 8px 22px rgba(4,56,113,0.05); }
  .card h2 { font-size: 14px; font-weight: 800; margin-bottom: 12px; }
  .card h2.o { color: #0F6E56; }
  .card h2.n { color: #A14E10; }

  label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 0 6px; }
  input, textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 9px; padding: 11px 12px; font-family: inherit; font-size: 13px; color: var(--ink); margin-bottom: 4px; }
  input:focus, textarea:focus { outline: none; border-color: var(--blue); }
  .hint { font-size: 11px; color: var(--muted); margin-bottom: 12px; }

  .tag-preview { min-height: 26px; margin-bottom: 4px; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin: 0 5px 5px 0; }
  .tag.offer { background: var(--offer-bg); color: var(--offer); }
  .tag.need { background: var(--need-bg); color: var(--need); }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; font-size: 13.5px; font-weight: 700; padding: 12px; border-radius: 10px; border: none; cursor: pointer; font-family: inherit; margin-top: 10px; }
  .btn-navy { background: var(--navy); color: #FFFFFF; }
  .btn-outline { background: transparent; color: var(--navy); border: 1.5px solid var(--line); }
  .btn-danger-outline { background: transparent; color: var(--danger); border: 1.5px solid #F3C9D3; }

  .error { font-size: 12px; color: var(--danger); margin: 6px 0 0; display: none; }
  .saved-note { font-size: 12px; color: var(--offer); margin: 6px 0 0; display: none; font-weight: 600; }

  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 30px; }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-inner">
      <a href="dashboard.html" aria-label="Back to board">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <p class="title">My profile</p>
    </div>
  </header>
  <div class="page-spacer"></div>

  <div class="body" id="body">
    <div class="empty">Loading your profile...</div>
  </div>

</div>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/db.js"></script>
<script type="module" src="js/trades.js"></script>
<script>
  let currentUser = null;

  window.onload = function () {
    let stored = localStorage.getItem("currentUser");
    if (stored === null) {
      document.getElementById("body").innerHTML =
        '<div class="empty">Sign in to view your profile. <br/><br/>' +
        '<a href="signin.html" style="color:var(--blue); font-weight:700;">Sign in</a></div>';
      return;
    }
    currentUser = JSON.parse(stored);
    waitForEngines();
  };

  function waitForEngines() {
    if (window.CBDb === undefined || window.CBAuth === undefined || window.CBTrades === undefined) {
      setTimeout(waitForEngines, 200);
      return;
    }
    /* self-heal my own rating (same rule-compliant approach as
       trades.html and dashboard.html — see the big comment in
       trades.js for why it can only ever update MY OWN rating) */
    CBTrades.recalcMyRating(currentUser.uid).then(function () {
      /* refresh currentUser with whatever the recalc just saved,
         so the numbers on screen are current, not stale */
      CBDb.getProfile(currentUser.uid).then(function (result) {
        if (result.ok && result.data !== null) {
          currentUser = Object.assign({ uid: currentUser.uid }, result.data);
          localStorage.setItem("currentUser", JSON.stringify(currentUser));
        }
        renderProfile();
      });
    });
  }

  function initials(name) {
    let parts = name.trim().split(" ");
    let first = parts[0].charAt(0);
    let second = parts.length > 1 ? parts[1].charAt(0) : "";
    return (first + second).toUpperCase();
  }

  function textToSkillArray(text) {
    return text
      .split(",")
      .map(function (s) { return s.trim().toLowerCase(); })
      .filter(function (s) { return s.length > 0; });
  }

  function previewTags(inputId, previewId, tagClass) {
    let skills = textToSkillArray(document.getElementById(inputId).value);
    document.getElementById(previewId).innerHTML = skills
      .map(function (s) { return '<span class="tag ' + tagClass + '">' + s + "</span>"; })
      .join("");
  }

  function renderProfile() {
    document.getElementById("body").innerHTML =
      '<div class="profile-head">' +
        '<div class="avatar-lg">' + initials(currentUser.name) + "</div>" +
        '<p class="profile-name">' + currentUser.name + "</p>" +
        '<p class="profile-meta">' + currentUser.institution + " &middot; " + currentUser.email + "</p>" +
        '<div class="stat-row">' +
          '<div class="stat"><p class="num">' +
          (currentUser.rating === null || currentUser.rating === undefined ? "New" : currentUser.rating) +
          '</p><p class="lbl">RATING</p></div>' +
          '<div class="stat"><p class="num">' + (currentUser.trades || 0) + '</p><p class="lbl">TRADES</p></div>' +
        "</div>" +
      "</div>" +

      '<div class="card">' +
        '<h2 class="o">Skills you offer</h2>' +
        '<textarea id="offersInput" rows="2">' + currentUser.offers.join(", ") + "</textarea>" +
        '<div class="tag-preview" id="offersPreview"></div>' +
        '<p class="hint">Separate with commas.</p>' +
      "</div>" +

      '<div class="card">' +
        '<h2 class="n">Skills you need</h2>' +
        '<textarea id="needsInput" rows="2">' + currentUser.needs.join(", ") + "</textarea>" +
        '<div class="tag-preview" id="needsPreview"></div>' +
        '<p class="hint">Separate with commas. Optional.</p>' +
      "</div>" +

      '<div class="card">' +
        "<h2>WhatsApp number</h2>" +
        '<input type="tel" id="whatsappInput" value="' + currentUser.whatsapp + '" />' +
        '<p class="hint">Only shared when you accept a trade. Never on your profile.</p>' +
      "</div>" +

      '<button class="btn btn-navy" id="saveBtn" onclick="saveProfile()">Save changes</button>' +
      '<p class="error" id="saveError"></p>' +
      '<p class="saved-note" id="savedNote">Saved.</p>' +

      '<button class="btn btn-outline" onclick="window.location.href=\'trades.html\'">' +
        '<svg class="icon sm" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg>My trades</button>' +

      '<button class="btn btn-danger-outline" onclick="handleSignOut()">' +
        '<svg class="icon sm" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out</button>';

    previewTags("offersInput", "offersPreview", "offer");
    previewTags("needsInput", "needsPreview", "need");
    document.getElementById("offersInput").oninput = function () { previewTags("offersInput", "offersPreview", "offer"); };
    document.getElementById("needsInput").oninput = function () { previewTags("needsInput", "needsPreview", "need"); };
  }

  async function saveProfile() {
    let errBox = document.getElementById("saveError");
    let savedNote = document.getElementById("savedNote");
    errBox.style.display = "none";
    savedNote.style.display = "none";

    let offers = textToSkillArray(document.getElementById("offersInput").value);
    let needs = textToSkillArray(document.getElementById("needsInput").value);

    if (offers.length === 0) {
      errBox.textContent = "List at least one skill you offer.";
      errBox.style.display = "block";
      return;
    }

    let digits = document.getElementById("whatsappInput").value.replace(/\D/g, "");
    let nigerianShape = /^(0[7-9][0-1]\d{8}|234[7-9][0-1]\d{8})$/;
    if (nigerianShape.test(digits) === false) {
      errBox.textContent = "Enter a real Nigerian mobile number (e.g. 08012345678).";
      errBox.style.display = "block";
      return;
    }

    let btn = document.getElementById("saveBtn");
    btn.disabled = true;
    btn.textContent = "Saving...";

    let updates = { offers: offers, needs: needs, whatsapp: digits };
    let result = await CBDb.saveProfile(currentUser.uid, updates);

    btn.disabled = false;
    btn.textContent = "Save changes";

    if (result.ok === false) {
      errBox.textContent = result.message;
      errBox.style.display = "block";
      return;
    }

    currentUser = Object.assign({}, currentUser, updates);
    localStorage.setItem("currentUser", JSON.stringify(currentUser));
    savedNote.style.display = "block";
  }

  function handleSignOut() {
    CBAuth.signOutUser().then(function () {
      localStorage.removeItem("currentUser");
      window.location.href = "index.html";
    });
  }
</script>
</body>
</html>
