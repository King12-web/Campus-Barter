<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Barter | The Board</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --navy: #043873;
    --navy-deep: #032B57;
    --blue: #4F9CF9;
    --yellow: #FFE492;
    --yellow-deep: #FFD966;
    --ink: #212529;
    --muted: #5B6470;
    --soft: #F7FAFD;
    --card: #FFFFFF;
    --line: #E3E9F0;
    --offer: #16A34A;
    --offer-bg: #E8F7EE;
    --need: #F97316;
    --need-bg: #FEF0E6;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; }

  body {
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--soft);
    color: var(--ink);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  h1, h2, h3, .btn, .brand-name { font-family: "DM Sans", "Inter", sans-serif; }

  .icon {
    width: 20px; height: 20px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    vertical-align: middle; flex-shrink: 0;
  }
  .icon.sm { width: 15px; height: 15px; }
  .icon.fill { fill: currentColor; stroke: none; }

  .app {
    width: 100%;
    max-width: 460px;   /* mobile default; desktop widens this below */
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: var(--navy);
    color: #FFFFFF;
    z-index: 100;
    box-shadow: 0 2px 14px rgba(3, 43, 87, 0.35);
  }
  .topbar-inner {
    max-width: 460px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    gap: 10px;
  }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 9px;
    background: var(--yellow); color: var(--navy);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .inst-switch {
    display: flex; align-items: center; gap: 6px;
    font-weight: 700; font-size: 14px;
    background: none; border: none; cursor: pointer;
    font-family: inherit; color: #FFFFFF;
    flex: 1; min-width: 0;
  }
  .inst-switch span {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .inst-switch .icon { color: var(--yellow); flex-shrink: 0; }

  .iconbtn {
    background: rgba(255,255,255,0.12);
    border: none; cursor: pointer; color: #FFFFFF;
    padding: 8px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .iconbtn:hover { background: rgba(255,255,255,0.2); }

  #instSelect { display: none; }
  #instSelect.open {
    display: block;
    max-width: 460px;
    margin: 0 auto;
    width: calc(100% - 32px);
    padding: 10px 12px;
    font-family: inherit; font-size: 13px;
    border: none; border-radius: 0 0 10px 10px;
    background: var(--navy-deep); color: #FFFFFF;
  }

  .page-spacer { height: 62px; }

  .body { padding: 14px 14px 90px; flex: 1; }

  .search-wrap {
    display: flex; align-items: center; gap: 8px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 11px 15px;
    margin-bottom: 10px;
    color: var(--muted);
  }
  .search-wrap:focus-within { border-color: var(--blue); }
  .search-wrap input {
    border: none; outline: none; flex: 1;
    font-family: inherit; font-size: 13.5px; color: var(--ink);
    background: transparent;
  }

  .filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; min-height: 30px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700;
    padding: 7px 13px; border-radius: 999px;
    border: 1.5px solid transparent;
    cursor: pointer; font-family: inherit;
  }
  .chip.on  { background: var(--offer-bg); color: var(--offer); }
  .chip.off { background: var(--card); color: var(--muted); border-color: var(--line); }
  .chip-note { font-size: 11px; color: var(--muted); }

  .section-title {
    font-size: 13.5px; font-weight: 800;
    display: flex; align-items: center; gap: 6px;
    margin: 18px 0 10px;
    color: var(--ink);
  }
  .section-title .icon { color: var(--blue); }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid var(--line);
    box-shadow: 0 8px 22px rgba(4, 56, 115, 0.05);
  }

  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; flex-shrink: 0;
  }
  .av-0 { background: #E1EEFE; color: var(--blue); }
  .av-1 { background: var(--offer-bg); color: var(--offer); }
  .av-2 { background: var(--need-bg); color: var(--need); }

  .tag {
    display: inline-block;
    font-size: 11.5px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
    margin: 0 5px 5px 0;
  }
  .tag.offer { background: var(--offer-bg); color: var(--offer); }
  .tag.need  { background: var(--need-bg);  color: var(--need); }
  .tag-label { font-size: 11px; font-weight: 800; margin: 9px 0 5px; letter-spacing: 0.02em; }
  .tag-label.o { color: var(--offer); }
  .tag-label.n { color: var(--need); }

  .person-top { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .person-top .name { font-size: 14px; font-weight: 800; font-family: "DM Sans", sans-serif; }
  .person-top .meta { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 3px; }
  .person-top .meta .icon { color: var(--yellow-deep); }

  /* Option C: skills split into two tinted panels side by side */
  .skill-split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .skill-panel {
    border-radius: 10px;
    padding: 10px 11px;
    min-width: 0;
  }
  .skill-panel.o { background: var(--offer-bg); }
  .skill-panel.n { background: var(--need-bg); }
  .skill-panel-label {
    font-size: 10px; font-weight: 800;
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }
  .skill-panel.o .skill-panel-label { color: #0F6E56; }
  .skill-panel.n .skill-panel-label { color: #A14E10; }
  .skill-panel-list {
    font-size: 12px; font-weight: 600;
    line-height: 1.55;
  }
  .skill-panel.o .skill-panel-list { color: #0F6E56; }
  .skill-panel.n .skill-panel-list { color: #A14E10; }

  .btn {
    display: block; width: 100%;
    text-align: center;
    font-size: 13.5px; font-weight: 700;
    padding: 12px;
    border-radius: 10px;
    border: none; cursor: pointer;
    font-family: inherit;
    margin-top: 11px;
  }
  .btn-navy   { background: var(--navy); color: #FFFFFF; }
  .btn-outline{ background: transparent; color: var(--navy); border: 1.5px solid var(--line); }
  .btn-outline:hover { border-color: var(--navy); }

  .match-hero {
    background: var(--navy);
    border: none;
    color: #FFFFFF;
    position: relative;
    overflow: hidden;
  }
  .match-hero .hero-curve {
    position: absolute; right: -60px; bottom: -60px;
    width: 200px; height: 200px; opacity: 0.25; pointer-events: none;
  }
  .match-hero .hero-curve path { stroke: var(--blue); stroke-width: 1.5; fill: none; }

  .swap-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; padding: 0 8px; position: relative; z-index: 1;
  }
  .swap-person { text-align: center; font-size: 12.5px; font-weight: 700; }
  .swap-person .avatar { margin: 0 auto 5px; border: 2px solid rgba(255,255,255,0.25); }
  .swap-mid {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--yellow); color: var(--navy);
    display: flex; align-items: center; justify-content: center;
  }
  .swap-mid .icon { width: 19px; height: 19px; }
  .match-note {
    font-size: 12.5px; color: #C4D4EA; text-align: center;
    position: relative; z-index: 1; margin-bottom: 4px;
  }
  .match-note b.o { color: #6EE7A8; }
  .match-note b.n { color: #FFC078; }
  .match-hero .btn-navy { background: var(--yellow); color: var(--navy); position: relative; z-index: 1; }

  .empty {
    text-align: center; color: var(--muted);
    font-size: 13.5px; padding: 30px 18px;
    background: var(--card); border-radius: var(--radius);
    border: 1px dashed var(--line);
  }
  .empty .icon { width: 30px; height: 30px; margin-bottom: 10px; color: var(--blue); opacity: 0.5; }

  .banner {
    background: var(--need-bg); color: #A14E10;
    font-size: 12.5px; font-weight: 600; line-height: 1.5;
    border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
  }
  .banner a { color: inherit; text-decoration: underline; }
  .verify-banner { display: flex; align-items: flex-start; gap: 8px; }
  .verify-banner .icon { flex-shrink: 0; margin-top: 1px; }

  #toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    width: fit-content; max-width: 90%;
    background: var(--navy); color: #FFFFFF;
    font-size: 12.5px; font-weight: 600; padding: 11px 18px;
    border-radius: 999px;
    opacity: 0; transition: opacity 0.25s;
    pointer-events: none;
    z-index: 200;
  }
  #toast.show { opacity: 1; }

  .navbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: center;
  }
  .navbar-inner {
    width: 100%; max-width: 460px;
    display: flex; justify-content: space-around;
    background: var(--card);
    border-top: 1px solid var(--line);
    padding: 9px 0 13px;
    box-shadow: 0 -4px 16px rgba(4, 56, 115, 0.06);
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 600; color: var(--muted);
    background: none; border: none; font-family: inherit; cursor: pointer;
    padding: 4px 10px;
  }
  .nav-item.active { color: var(--navy); font-weight: 800; }
  .nav-item.active .icon { color: var(--blue); }

  /* nav links: hidden on mobile (bottom tab bar covers it there).
     This rule must sit BEFORE the desktop media query below —
     same-specificity CSS resolves ties by source order, so a
     rule written after a media query always wins the tie even
     if the earlier one is "more specific-looking". */
  .desktop-nav { display: none; }

  /* ================= DESKTOP LAYOUT ================= */
  /* Below 900px: unchanged phone-width column, exactly as before.
     Above it: the app actually uses the screen — wide topbar,
     horizontal nav instead of the thumb-reach bottom bar, and a
     real multi-column grid for people instead of one long strip. */
  @media (min-width: 900px) {
    .app { max-width: 1100px; }
    .topbar-inner {
      max-width: 1100px; padding: 12px 28px;
      flex-wrap: wrap; row-gap: 8px;
    }
    #instSelect.open { max-width: 1100px; }

    .body { max-width: 1100px; margin: 0 auto; padding: 24px 28px 60px; width: 100%; }

    /* horizontal nav replaces the bottom tab bar entirely */
    .navbar { display: none; }
    .desktop-nav { display: flex; gap: 2px; }
    .desktop-nav button {
      display: flex; align-items: center; gap: 6px;
      background: none; border: none; cursor: pointer;
      font-family: inherit; font-size: 12.5px; font-weight: 600;
      color: rgba(255,255,255,0.75);
      padding: 7px 10px; border-radius: 8px;
      white-space: nowrap;
    }
    .desktop-nav button:hover { background: rgba(255,255,255,0.1); color: #FFFFFF; }
    .desktop-nav button.active { background: rgba(255,255,255,0.14); color: #FFFFFF; }
    .desktop-nav .icon { width: 16px; height: 16px; }

    .search-wrap { max-width: 420px; }
    .inst-switch { flex: 0 0 auto; max-width: 180px; }

    #peopleList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }
    #peopleList .card { margin-bottom: 0; }

    .match-hero-wrap { max-width: 480px; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand-mark">
        <svg class="icon" style="width:17px;height:17px;" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </span>

      <button class="inst-switch" onclick="toggleSwitcher()">
        <span id="instLabel">Campus</span>
        <svg class="icon sm" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </button>

      <nav class="desktop-nav" aria-label="Main">
        <button class="active">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Board
        </button>
        <button onclick="showToast('Matches page — coming next')">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          Matches
        </button>
        <button onclick="showToast('Add skills lives on your Profile page')">
          <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add
        </button>
        <button onclick="showToast('Trades page — coming soon')">
          <svg class="icon" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          Trades
        </button>
        <button onclick="showToast('Profile page — coming soon')">
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Profile
        </button>
      </nav>

      <button class="iconbtn" aria-label="Notifications">
        <svg class="icon" style="width:17px;height:17px;" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>

      <button class="iconbtn" id="signOutBtn" aria-label="Sign out" onclick="handleSignOut()" style="display: none;">
        <svg class="icon" style="width:17px;height:17px;" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
    <select id="instSelect" onchange="switchInstitution(this.value)"></select>
  </header>

  <div class="page-spacer"></div>

  <div class="body">
    <div id="profileBanner"></div>

    <div class="search-wrap">
      <svg class="icon sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchBox" placeholder="Search skills or people" oninput="render()" />
    </div>

    <div class="filter-row" id="filterRow"></div>

    <div id="matchSection"></div>

    <div class="section-title" id="peopleTitle"></div>
    <div id="peopleList"></div>
  </div>

  <div id="toast"></div>

  <nav class="navbar">
    <div class="navbar-inner">
      <button class="nav-item active">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Board
      </button>
      <button class="nav-item" onclick="showToast('Matches page — coming next')">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        Matches
      </button>
      <button class="nav-item" onclick="showToast('Add skills lives on your Profile page')">
        <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add
      </button>
      <button class="nav-item" onclick="showToast('Trades page — coming soon')">
        <svg class="icon" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Trades
      </button>
      <button class="nav-item" onclick="showToast('Profile page — coming soon')">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </button>
    </div>
  </nav>
</div>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/db.js"></script>
<script>
  let PEOPLE = [];
  let dataLoaded = false;

  const IN_PERSON = [
    "laptop repair", "phone repair", "haircut", "barbing",
    "makeup", "tailoring", "photography", "fitness coaching"
  ];

  function isRemote(skill) {
    return IN_PERSON.includes(skill) === false;
  }

  let currentUser = null;
  let viewInstitution = null;
  let remoteOnly = true;

  window.onload = function () {
    let stored = localStorage.getItem("currentUser");
    if (stored !== null) {
      currentUser = JSON.parse(stored);
      viewInstitution = currentUser.institution;
      document.getElementById("signOutBtn").style.display = "";
    } else {
      viewInstitution = "University of Lagos";
      document.getElementById("profileBanner").innerHTML =
        '<div class="banner">You are browsing as a guest. ' +
        'Open the onboarding page (join.html) to join the board, ' +
        'or <a href="signin.html">sign in</a> if you already have.</div>';
    }

    if (new URLSearchParams(window.location.search).get("verify") === "1") {
      document.getElementById("profileBanner").innerHTML +=
        '<div class="banner verify-banner">' +
        '<svg class="icon sm" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9 22 2z"/></svg>' +
        '<span>Verify your email to unlock proposing and accepting trades. ' +
        'Check your inbox (and spam) for the link.</span>' +
        '</div>';
    }

    loadRealPeople();
  };

  function loadRealPeople() {
    if (window.CBDb === undefined) {
      setTimeout(loadRealPeople, 200);
      return;
    }

    let fetchPromise = viewInstitution === "__ALL__"
      ? CBDb.getAllProfiles()
      : CBDb.getProfilesByInstitution(viewInstitution);

    fetchPromise.then(function (result) {
      dataLoaded = true;
      if (result.ok) {
        PEOPLE = result.data;
      } else {
        PEOPLE = [];
        console.error("Failed to load profiles:", result.message);
      }
      buildSwitcher();
      render();
    });
  }

  function handleSignOut() {
    if (window.CBAuth === undefined) return;
    CBAuth.signOutUser().then(function () {
      localStorage.removeItem("currentUser");
      window.location.href = "index.html";
    });
  }

  function buildSwitcher() {
    let sel = document.getElementById("instSelect");
    let html = "";

    if (currentUser !== null) {
      html += '<option value="' + currentUser.institution + '">My campus — ' +
              currentUser.institution + "</option>";
    }
    html += '<option value="__ALL__">All campuses (wider search)</option>';

    if (viewInstitution !== "__ALL__" &&
        (currentUser === null || viewInstitution !== currentUser.institution)) {
      html += '<option value="' + viewInstitution + '">' + viewInstitution + "</option>";
    }

    sel.innerHTML = html;
    sel.value = viewInstitution;
  }

  function toggleSwitcher() {
    document.getElementById("instSelect").classList.toggle("open");
  }

  function switchInstitution(value) {
    viewInstitution = value;
    let away = currentUser === null || value !== currentUser.institution;
    remoteOnly = away;
    document.getElementById("instSelect").classList.remove("open");

    dataLoaded = false;
    PEOPLE = [];
    render();
    loadRealPeople();
  }

  function toggleRemote() {
    remoteOnly = remoteOnly === false;
    render();
  }

  function isMatch(me, them) {
    let theyHelpMe = them.offers.some(function (skill) {
      return me.needs.includes(skill);
    });
    let iHelpThem = me.offers.some(function (skill) {
      return them.needs.includes(skill);
    });
    return theyHelpMe && iHelpThem;
  }

  function overlap(offersA, needsB) {
    return offersA.filter(function (skill) {
      return needsB.includes(skill);
    });
  }

  const AV_CLASSES = ["av-0", "av-1", "av-2"];

  function initials(name) {
    let parts = name.trim().split(" ");
    let first = parts[0].charAt(0);
    let second = parts.length > 1 ? parts[1].charAt(0) : "";
    return (first + second).toUpperCase();
  }

  function tagsHTML(skills, cls) {
    return skills.map(function (s) {
      return '<span class="tag ' + cls + '">' + s + "</span>";
    }).join("");
  }

  function starIcon() {
    return '<svg class="icon sm fill" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
  }

  function heroCurve() {
    return '<svg class="hero-curve" viewBox="0 0 200 200" aria-hidden="true">' +
      '<path d="M 5 100 Q 50 20 100 60 T 195 50" />' +
      '<path d="M 5 130 Q 60 50 110 90 T 195 80" />' +
      "</svg>";
  }

  function render() {
    let searchTerm = document.getElementById("searchBox").value.trim().toLowerCase();
    let viewingAway = currentUser === null || viewInstitution !== currentUser.institution;
    let viewingAll = viewInstitution === "__ALL__";

    document.getElementById("instLabel").textContent =
      viewingAll ? "All campuses" : viewInstitution;

    if (dataLoaded === false) {
      document.getElementById("matchSection").innerHTML = "";
      document.getElementById("peopleTitle").innerHTML = "Loading the board...";
      document.getElementById("peopleList").innerHTML =
        '<div class="empty">' +
        '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>' +
        "<p>Fetching students from your campus...</p></div>";
      document.getElementById("filterRow").innerHTML = "";
      return;
    }

    let hiddenSkillCount = 0;
    let visible = [];

    for (let i = 0; i < PEOPLE.length; i++) {
      let p = PEOPLE[i];

      if (currentUser !== null && p.email === currentUser.email) continue;
      if (viewingAll === false && p.institution !== viewInstitution) continue;

      if (searchTerm.length > 0) {
        let inName = p.name.toLowerCase().includes(searchTerm);
        let inSkills = p.offers.concat(p.needs).some(function (s) {
          return s.includes(searchTerm);
        });
        if (inName === false && inSkills === false) continue;
      }

      let shownOffers = p.offers;
      if (viewingAway && remoteOnly) {
        shownOffers = p.offers.filter(isRemote);
        hiddenSkillCount += p.offers.length - shownOffers.length;
        if (shownOffers.length === 0) continue;
      }

      visible.push({ person: p, shownOffers: shownOffers });
    }

    let filterRow = document.getElementById("filterRow");
    if (viewingAway) {
      let chipClass = remoteOnly ? "on" : "off";
      let checkIcon = remoteOnly
        ? '<svg class="icon sm" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
        : "";
      let note = remoteOnly && hiddenSkillCount > 0
        ? '<span class="chip-note">(' + hiddenSkillCount + " in-person skills hidden)</span>"
        : "";
      filterRow.innerHTML =
        '<button class="chip ' + chipClass + '" onclick="toggleRemote()">' +
        checkIcon + "Remote-friendly only</button>" + note;
    } else {
      filterRow.innerHTML = "";
    }

    let matchSection = document.getElementById("matchSection");
    matchSection.innerHTML = "";

    if (currentUser !== null) {
      let matches = visible.filter(function (v) {
        return isMatch(currentUser, v.person);
      });

      if (matches.length > 0) {
        let m = matches[0].person;
        let youGive = overlap(currentUser.offers, m.needs);
        let youGet  = overlap(m.offers, currentUser.needs);

        matchSection.innerHTML =
          '<div class="section-title">' +
          '<svg class="icon sm" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>' +
          "New match for you</div>" +
          '<div class="card match-hero">' +
            heroCurve() +
            '<div class="swap-row">' +
              '<div class="swap-person"><div class="avatar av-0">' + initials(currentUser.name) + "</div>You</div>" +
              '<div class="swap-mid"><svg class="icon" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></div>' +
              '<div class="swap-person"><div class="avatar av-2">' + initials(m.name) + "</div>" + m.name + "</div>" +
            "</div>" +
            '<p class="match-note">Your <b class="o">' + youGive[0] +
            '</b> for their <b class="n">' + youGet[0] + "</b></p>" +
            '<button class="btn btn-navy" onclick="showToast(\'Proposal flow lands on the Trades page — next build\')">Propose trade</button>' +
          "</div>";
      }
    }

    document.getElementById("peopleTitle").innerHTML =
      viewingAll ? "People across campuses" :
      (currentUser !== null && viewInstitution === currentUser.institution)
        ? "People on your campus" : "People at " + viewInstitution;

    let list = document.getElementById("peopleList");

    if (visible.length === 0) {
      let emptyMsg = viewingAway
        ? "No one to show here yet. Try another campus, clear filters, or check back soon."
        : "Your campus board is quiet right now. Share Campus Barter with friends to get it started.";
      list.innerHTML =
        '<div class="empty">' +
        '<svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
        "<p>" + emptyMsg + "</p></div>";
      return;
    }

    let html = "";
    for (let i = 0; i < visible.length; i++) {
      let p = visible[i].person;
      let av = AV_CLASSES[i % AV_CLASSES.length];
      let offersLine = visible[i].shownOffers.join(", ");
      let needsLine = p.needs.length > 0 ? p.needs.join(", ") : "nothing listed";
      html +=
        '<div class="card">' +
          '<div class="person-top">' +
            '<div class="avatar ' + av + '">' + initials(p.name) + "</div>" +
            "<div>" +
              '<p class="name">' + p.name + "</p>" +
              '<p class="meta">' + p.institution + " &middot; " + starIcon() + " " +
              (p.rating === null || p.rating === undefined ? "New" : p.rating.toFixed(1)) +
              " &middot; " + (p.trades || 0) + " trades</p>" +
            "</div>" +
          "</div>" +
          '<div class="skill-split">' +
            '<div class="skill-panel o"><p class="skill-panel-label">OFFERS</p><p class="skill-panel-list">' + offersLine + "</p></div>" +
            '<div class="skill-panel n"><p class="skill-panel-label">NEEDS</p><p class="skill-panel-list">' + needsLine + "</p></div>" +
          "</div>" +
          '<button class="btn btn-outline" onclick="showToast(\'Proposal flow lands on the Trades page — next build\')">Propose swap</button>' +
        "</div>";
    }
    list.innerHTML = html;
  }

  let toastTimer = null;
  function showToast(message) {
    let t = document.getElementById("toast");
    t.textContent = message;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }
</script>
</body>
</html>
