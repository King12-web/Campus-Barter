<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Swap — The Board</title>

<!-- Inter, with system fallbacks so the page still looks right
     if the font fails to load on a slow connection. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

<style>
  :root {
    --primary: #5B3DF5;
    --primary-soft: #EEEBFE;
    --ink: #1E293B;
    --muted: #6B7280;
    --offer: #16A34A;
    --offer-bg: #E8F7EE;
    --need: #F97316;
    --need-bg: #FEF0E6;
    --bg: #F2F4F7;
    --card: #FFFFFF;
    --line: #E5E7EB;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; }

  body {
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .app {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ---- icons: inline SVG, colored by "currentColor" ----
     One CSS class sizes and strokes every icon the same way. */
  .icon {
    width: 20px; height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    vertical-align: middle;
    flex-shrink: 0;
  }
  .icon.sm { width: 15px; height: 15px; }
  .icon.fill { fill: currentColor; stroke: none; }

  /* ---- app bar ---- */
  .appbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 8px;
  }
  .inst-switch {
    display: flex; align-items: center; gap: 6px;
    font-weight: 700; font-size: 14px;
    background: none; border: none; cursor: pointer;
    font-family: inherit; color: var(--ink);
    max-width: 240px;
  }
  .inst-switch span {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .iconbtn { background: none; border: none; cursor: pointer; color: var(--ink); padding: 4px; }

  /* hidden native select that powers the switcher */
  #instSelect { display: none; }
  #instSelect.open {
    display: block;
    width: calc(100% - 32px);
    margin: 0 16px 8px;
    padding: 10px;
    font-family: inherit; font-size: 13px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink);
  }

  .body { padding: 0 14px 90px; flex: 1; }

  .search-wrap {
    display: flex; align-items: center; gap: 8px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 14px;
    margin-bottom: 10px;
    color: var(--muted);
  }
  .search-wrap input {
    border: none; outline: none; flex: 1;
    font-family: inherit; font-size: 13px; color: var(--ink);
    background: transparent;
  }

  /* ---- remote filter chip ---- */
  .filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; min-height: 30px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600;
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid transparent;
    cursor: pointer; font-family: inherit;
  }
  .chip.on  { background: var(--offer-bg); color: var(--offer); }
  .chip.off { background: var(--card); color: var(--muted); border-color: var(--line); }
  .chip-note { font-size: 11px; color: var(--muted); }

  .section-title {
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
    margin: 14px 0 8px;
    color: var(--ink);
  }
  .section-title .icon { color: var(--primary); }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid var(--line);
  }

  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; flex-shrink: 0;
  }
  .av-0 { background: var(--primary-soft); color: var(--primary); }
  .av-1 { background: var(--offer-bg); color: var(--offer); }
  .av-2 { background: var(--need-bg); color: var(--need); }

  .tag {
    display: inline-block;
    font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: 999px;
    margin: 0 4px 4px 0;
  }
  .tag.offer { background: var(--offer-bg); color: var(--offer); }
  .tag.need  { background: var(--need-bg);  color: var(--need); }
  .tag-label { font-size: 11px; font-weight: 700; margin: 8px 0 4px; }
  .tag-label.o { color: var(--offer); }
  .tag-label.n { color: var(--need); }

  .person-top { display: flex; gap: 10px; align-items: center; margin-bottom: 4px; }
  .person-top .name { font-size: 13px; font-weight: 700; }
  .person-top .meta { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 3px; }
  .person-top .meta .icon { color: #F5B50A; }

  .btn {
    display: block; width: 100%;
    text-align: center;
    font-size: 13px; font-weight: 600;
    padding: 11px;
    border-radius: 10px;
    border: none; cursor: pointer;
    font-family: inherit;
    margin-top: 10px;
  }
  .btn-primary { background: var(--primary); color: #FFFFFF; }
  .btn-outline { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }

  /* ---- match hero ---- */
  .match-hero { border: 2px solid var(--primary); }
  .swap-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px; padding: 0 12px;
  }
  .swap-person { text-align: center; font-size: 12px; font-weight: 600; }
  .swap-person .avatar { margin: 0 auto 4px; }
  .swap-mid { color: var(--primary); }
  .swap-mid .icon { width: 26px; height: 26px; }
  .match-note { font-size: 12px; color: var(--muted); text-align: center; }
  .match-note b.o { color: var(--offer); }
  .match-note b.n { color: var(--need); }

  .empty {
    text-align: center; color: var(--muted);
    font-size: 13px; padding: 26px 16px;
  }
  .empty .icon { width: 30px; height: 30px; margin-bottom: 8px; color: var(--line); }

  /* ---- notice banner (no profile yet) ---- */
  .banner {
    background: var(--need-bg); color: var(--need);
    font-size: 12px; font-weight: 600;
    border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
  }
  .verify-banner {
    display: flex; align-items: center; gap: 8px;
  }

  /* ---- toast ---- */
  #toast {
    position: sticky; bottom: 96px;
    margin: 0 auto; width: fit-content; max-width: 90%;
    background: var(--ink); color: #FFFFFF;
    font-size: 12px; padding: 10px 16px;
    border-radius: 999px;
    opacity: 0; transition: opacity 0.25s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* ---- bottom nav ---- */
  .navbar {
    position: fixed; bottom: 0;
    width: 100%; max-width: 420px;
    display: flex; justify-content: space-around;
    background: var(--card);
    border-top: 1px solid var(--line);
    padding: 10px 0 14px;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; color: var(--muted);
    background: none; border: none; font-family: inherit; cursor: pointer;
  }
  .nav-item.active { color: var(--primary); font-weight: 700; }
</style>
</head>
<body>
<div class="app">

  <div class="appbar">
    <button class="iconbtn" aria-label="Menu">
      <svg class="icon" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <!-- Institution switcher: tap to reveal the select -->
    <button class="inst-switch" onclick="toggleSwitcher()">
      <span id="instLabel">Campus</span>
      <svg class="icon sm" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>

    <button class="iconbtn" aria-label="Notifications">
      <svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
  </div>

  <select id="instSelect" onchange="switchInstitution(this.value)"></select>

  <div class="body">
    <div id="profileBanner"></div>

    <div class="search-wrap">
      <svg class="icon sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchBox" placeholder="Search skills or people" oninput="render()" />
    </div>

    <div class="filter-row" id="filterRow"></div>

    <div id="matchSection"></div>

    <div class="section-title" id="peopleTitle"></div>
    <div id="peopleList"></div>

    <div id="toast"></div>
  </div>

  <div class="navbar">
    <button class="nav-item active">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Board
    </button>
    <button class="nav-item" onclick="showToast('Matches page — coming next')">
      <svg class="icon" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      Matches
    </button>
    <button class="nav-item" onclick="showToast('Add skills lives on your Profile page')">
      <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add
    </button>
    <button class="nav-item" onclick="showToast('Trades page — coming soon')">
      <svg class="icon" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Trades
    </button>
    <button class="nav-item" onclick="showToast('Profile page — coming soon')">
      <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </button>
  </div>
</div>

<script>
  /* ============================================================
     DEMO DATA
     ------------------------------------------------------------
     Until Phase 4 (real backend), the board is seeded with demo
     people. Institution values are EXACT spellings from our
     dataset — that discipline is what makes filtering work.
     ============================================================ */
  const DEMO_PEOPLE = [
    { name: "Tunde K.",  institution: "University of Lagos",
      offers: ["laptop repair", "phone repair"],
      needs:  ["cv design", "graphics design"],
      rating: 4.7, trades: 9 },
    { name: "Zainab K.", institution: "University of Lagos",
      offers: ["maths tutoring", "writing"],
      needs:  ["graphics design", "public speaking"],
      rating: 4.6, trades: 9 },
    { name: "Moyo O.",   institution: "University of Lagos",
      offers: ["graphics design", "video editing"],
      needs:  ["maths tutoring"],
      rating: 4.9, trades: 7 },
    { name: "Chika E.",  institution: "University of Ibadan",
      offers: ["ui and ux design", "figma tutoring"],
      needs:  ["python help", "cv design"],
      rating: 5.0, trades: 3 },
    { name: "Emeka O.",  institution: "University of Nigeria, Nsukka",
      offers: ["photography", "photo editing"],
      needs:  ["cv design"],
      rating: 4.4, trades: 5 },
    { name: "Fatima S.", institution: "Ahmadu Bello University, Zaria",
      offers: ["makeup", "fashion illustration"],
      needs:  ["excel tutoring"],
      rating: 4.8, trades: 6 },
    { name: "Seyi A.",   institution: "Lagos State University, Ojo",
      offers: ["barbing", "fitness coaching"],
      needs:  ["writing"],
      rating: 4.2, trades: 4 }
  ];

  /* Skills that require being physically present.
     TEMPORARY: in Phase 3, skill CATEGORIES carry a remote flag
     instead of this hand-kept list. */
  const IN_PERSON = [
    "laptop repair", "phone repair", "haircut", "barbing",
    "makeup", "tailoring", "photography", "fitness coaching"
  ];

  function isRemote(skill) {
    return IN_PERSON.includes(skill) === false;
  }

  /* ============================================================
     STATE
     ============================================================ */
  let currentUser = null;
  let viewInstitution = null;   // which campus the board shows
  let remoteOnly = true;        // filter state when viewing away

  window.onload = function () {
    let stored = localStorage.getItem("currentUser");
    if (stored !== null) {
      currentUser = JSON.parse(stored);
      viewInstitution = currentUser.institution;
    } else {
      /* No onboarding done on this device: show the board
         read-only with a banner, defaulting to UNILAG. */
      viewInstitution = "University of Lagos";
      document.getElementById("profileBanner").innerHTML =
        '<div class="banner">You are browsing as a guest. ' +
        'Open the onboarding page (join.html) to join the board.</div>';
    }

    /* signin.html flags an unverified sign-in with ?verify=1.
       Friendly reminder, not a wall: they can still browse.
       Trade actions will enforce verification once the
       Trades page exists. */
    if (new URLSearchParams(window.location.search).get("verify") === "1") {
      document.getElementById("profileBanner").innerHTML +=
        '<div class="banner verify-banner">' +
        '<svg class="icon sm" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9 22 2z"/></svg>' +
        '<span>Verify your email to unlock proposing and accepting trades. ' +
        'Check your inbox (and spam) for the link.</span>' +
        '</div>';
    }

    buildSwitcher();
    render();
  };

  /* ============================================================
     INSTITUTION SWITCHER
     ------------------------------------------------------------
     "My campus" first, then "All campuses", then every campus
     that actually has people on it (no point listing 169 empty
     boards — in Phase 4 the backend returns campuses with
     member counts instead).
     ============================================================ */
  function buildSwitcher() {
    let sel = document.getElementById("instSelect");
    let campusesWithPeople = [];
    for (let i = 0; i < DEMO_PEOPLE.length; i++) {
      let inst = DEMO_PEOPLE[i].institution;
      if (campusesWithPeople.includes(inst) === false) {
        campusesWithPeople.push(inst);
      }
    }
    campusesWithPeople.sort();

    let html = "";
    if (currentUser !== null) {
      html += '<option value="' + currentUser.institution + '">My campus — ' +
              currentUser.institution + "</option>";
    }
    html += '<option value="__ALL__">All campuses (wider search)</option>';
    for (let i = 0; i < campusesWithPeople.length; i++) {
      html += '<option value="' + campusesWithPeople[i] + '">' +
              campusesWithPeople[i] + "</option>";
    }
    sel.innerHTML = html;
    sel.value = viewInstitution;
  }

  function toggleSwitcher() {
    document.getElementById("instSelect").classList.toggle("open");
  }

  function switchInstitution(value) {
    viewInstitution = value;
    /* DECISION #3 in action: leaving your own campus turns the
       remote-friendly filter ON by default (never silently). */
    let away = currentUser === null || value !== currentUser.institution;
    remoteOnly = away;
    document.getElementById("instSelect").classList.remove("open");
    render();
  }

  function toggleRemote() {
    remoteOnly = remoteOnly === false;
    render();
  }

  /* ============================================================
     THE MATCHER  (Phase 2's heart, delivered)
     ------------------------------------------------------------
     Decision #1: a match = at least ONE skill overlapping in
     EACH direction.
       - .some(fn)      true if ANY item passes the test
       - .includes(x)   true if the array contains x
     So: "does any of THEIR offers appear in MY needs?"
     AND  "does any of MY offers appear in THEIR needs?"
     ============================================================ */
  function isMatch(me, them) {
    let theyHelpMe = them.offers.some(function (skill) {
      return me.needs.includes(skill);
    });
    let iHelpThem = me.offers.some(function (skill) {
      return them.needs.includes(skill);
    });
    return theyHelpMe && iHelpThem;
  }

  /* Which exact skills overlap — used to write the match note. */
  function overlap(offersA, needsB) {
    return offersA.filter(function (skill) {
      return needsB.includes(skill);
    });
  }

  /* ============================================================
     RENDERING
     ============================================================ */
  const AV_CLASSES = ["av-0", "av-1", "av-2"];

  function initials(name) {
    let parts = name.trim().split(" ");
    let first = parts[0].charAt(0);
    let second = parts.length > 1 ? parts[1].charAt(0) : "";
    return (first + second).toUpperCase();
  }

  function tagsHTML(skills, cls) {
    return skills.map(function (s) {
      return '<span class="tag ' + cls + '">' + s + "</span>";
    }).join("");
  }

  function starIcon() {
    return '<svg class="icon sm fill" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
  }

  function render() {
    let searchTerm = document.getElementById("searchBox").value.trim().toLowerCase();
    let viewingAway = currentUser === null || viewInstitution !== currentUser.institution;
    let viewingAll = viewInstitution === "__ALL__";

    /* label in the app bar */
    document.getElementById("instLabel").textContent =
      viewingAll ? "All campuses" : viewInstitution;

    /* ---- pick the people to show ---- */
    let hiddenSkillCount = 0;
    let visible = [];

    for (let i = 0; i < DEMO_PEOPLE.length; i++) {
      let p = DEMO_PEOPLE[i];

      if (viewingAll === false && p.institution !== viewInstitution) continue;

      /* search: name or any skill contains the term */
      if (searchTerm.length > 0) {
        let inName = p.name.toLowerCase().includes(searchTerm);
        let inSkills = p.offers.concat(p.needs).some(function (s) {
          return s.includes(searchTerm);
        });
        if (inName === false && inSkills === false) continue;
      }

      /* remote filter (only bites when browsing away from home):
         hide in-person offers; count what we hid; drop people
         with nothing left to show. Transparent, never silent. */
      let shownOffers = p.offers;
      if (viewingAway && remoteOnly) {
        shownOffers = p.offers.filter(isRemote);
        hiddenSkillCount += p.offers.length - shownOffers.length;
        if (shownOffers.length === 0) continue;
      }

      visible.push({ person: p, shownOffers: shownOffers });
    }

    /* ---- filter chip row ---- */
    let filterRow = document.getElementById("filterRow");
    if (viewingAway) {
      let chipClass = remoteOnly ? "on" : "off";
      let checkIcon = remoteOnly
        ? '<svg class="icon sm" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
        : "";
      let note = remoteOnly && hiddenSkillCount > 0
        ? '<span class="chip-note">(' + hiddenSkillCount + " in-person skills hidden)</span>"
        : "";
      filterRow.innerHTML =
        '<button class="chip ' + chipClass + '" onclick="toggleRemote()">' +
        checkIcon + "Remote-friendly only</button>" + note;
    } else {
      filterRow.innerHTML = "";
    }

    /* ---- matches (only meaningful with a profile) ---- */
    let matchSection = document.getElementById("matchSection");
    matchSection.innerHTML = "";

    if (currentUser !== null) {
      let matches = visible.filter(function (v) {
        return isMatch(currentUser, v.person);
      });

      if (matches.length > 0) {
        let m = matches[0].person;
        let youGive = overlap(currentUser.offers, m.needs);
        let youGet  = overlap(m.offers, currentUser.needs);

        matchSection.innerHTML =
          '<div class="section-title">' +
          '<svg class="icon sm" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>' +
          "New match for you</div>" +
          '<div class="card match-hero">' +
            '<div class="swap-row">' +
              '<div class="swap-person"><div class="avatar av-0">' + initials(currentUser.name) + "</div>You</div>" +
              '<div class="swap-mid"><svg class="icon" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></div>' +
              '<div class="swap-person"><div class="avatar av-2">' + initials(m.name) + "</div>" + m.name + "</div>" +
            "</div>" +
            '<p class="match-note">Your <b class="o">' + youGive[0] +
            '</b> for their <b class="n">' + youGet[0] + "</b></p>" +
            '<button class="btn btn-primary" onclick="showToast(\'Proposal flow lands on the Trades page — next build\')">Propose trade</button>' +
          "</div>";
      }
    }

    /* ---- people cards ---- */
    document.getElementById("peopleTitle").innerHTML =
      viewingAll ? "People across campuses" :
      (currentUser !== null && viewInstitution === currentUser.institution)
        ? "People on your campus" : "People at " + viewInstitution;

    let list = document.getElementById("peopleList");

    if (visible.length === 0) {
      list.innerHTML =
        '<div class="empty">' +
        '<svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
        "<p>No one to show here yet. Try another campus, clear filters, or invite friends to join.</p></div>";
      return;
    }

    let html = "";
    for (let i = 0; i < visible.length; i++) {
      let p = visible[i].person;
      let av = AV_CLASSES[i % AV_CLASSES.length];
      html +=
        '<div class="card">' +
          '<div class="person-top">' +
            '<div class="avatar ' + av + '">' + initials(p.name) + "</div>" +
            "<div>" +
              '<p class="name">' + p.name + "</p>" +
              '<p class="meta">' + p.institution + " &middot; " + starIcon() + " " +
              p.rating.toFixed(1) + " &middot; " + p.trades + " trades</p>" +
            "</div>" +
          "</div>" +
          '<p class="tag-label o">Offers</p>' + tagsHTML(visible[i].shownOffers, "offer") +
          '<p class="tag-label n">Needs</p>' + tagsHTML(p.needs, "need") +
          '<button class="btn btn-outline" onclick="showToast(\'Proposal flow lands on the Trades page — next build\')">Propose swap</button>' +
        "</div>";
    }
    list.innerHTML = html;
  }

  /* ---- tiny toast helper ---- */
  let toastTimer = null;
  function showToast(message) {
    let t = document.getElementById("toast");
    t.textContent = message;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }
</script>
